[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rolefit-auto-apply"
version = "0.1.0"
description = "Tailor a master CV for specific roles and apply with the matching PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rolefit Contributors" }]
keywords = ["resume", "cv", "job-search", "ats", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "reportlab>=4.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
browser = ["playwright>=1.44"]
llm = ["openai>=1.40", "anthropic>=0.34", "google-genai>=1.0"]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.2",
    "ruff>=0.8",
]

[project.scripts]
rolefit = "rolefit.cli:app"

[project.urls]
Homepage = "https://github.com/rolefit/rolefit-auto-apply"
Documentation = "https://github.com/rolefit/rolefit-auto-apply/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/rolefit/rolefit-auto-apply/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rolefit"]

[tool.hatch.build.targets.wheel.force-include]
"templates/ats_clean.html" = "rolefit/templates/ats_clean.html"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["rolefit"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--strict-markers"]
